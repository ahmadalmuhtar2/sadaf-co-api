services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "4444:5432"
    environment:
      POSTGRES_USER: ahmad
      POSTGRES_PASSWORD: ASKsome123
      POSTGRES_DB: sadaf
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6666:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
